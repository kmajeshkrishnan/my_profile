services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "${NGINX_PORT}:80"
      - 443:443
    depends_on:
      - frontend
      - backend
    networks:
      - portfolio-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
      - ./nginx/logs:/var/log/nginx  # Add this for security logs
    restart: unless-stopped

  frontend:
    build:
      context: ./portfolio-app
      dockerfile: Dockerfile
    expose:
      - "${ANGULAR_PORT}"
    ports:
      - "${ANGULAR_PORT}:${ANGULAR_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
    networks:
      - portfolio-network

  backend:
    build:
      context: ./portfolio-backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    expose:
      - "${BACKEND_PORT}"
    volumes:
      - ./portfolio-backend:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
    networks:
      - portfolio-network
    restart: unless-stopped

volumes:
  nginx_logs:

networks:
  portfolio-network:
    driver: bridge 