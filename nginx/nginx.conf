events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    client_max_body_size 5M;

    # Rate limiting to prevent brute force attacks
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=5r/s;

    # Log formats
    log_format security '[$time_local] Security Block: $remote_addr - "$request" - "$http_user_agent"';
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    upstream frontend {
        server frontend:4200;
    }

    upstream backend {
        server backend:8000;
    }

    # HTTP server for initial setup and ACME challenge
    server {
        listen 80;
        server_name ajeshkrishnan.com www.ajeshkrishnan.com;

        # ========== SECURITY BLOCKS ==========
        # Block attacks even on HTTP before redirect
        location ~* (\.env|\.git|\.htaccess|\.bak|/etc/passwd|/\+CSCOE\+) {
            access_log /var/log/nginx/security.log security;
            return 444;
        }

        # ACME challenge - keep this accessible
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            autoindex on;
            allow all;
            # No security blocks here to allow certbot to work
        }

        # Redirect everything else to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name ajeshkrishnan.com www.ajeshkrishnan.com;

        # SSL configuration from your volume mount
        include /etc/nginx/conf.d/ssl.conf;

        # ========== SECURITY HEADERS ==========
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ========== SECURITY BLOCKS ==========
        # Block common attack patterns
        location ~* (\.env|\.git|\.htaccess|\.bak|\.backup|/etc/passwd) {
            access_log /var/log/nginx/security.log security;
            return 444;
        }

        # Block Cisco VPN exploit attempts
        location ~* /\+CSCOE\+ {
            access_log /var/log/nginx/security.log security;
            return 444;
        }

        # Block common exploit paths
        location ~* (wp-admin|phpmyadmin|administrator|\.php|\.asp|\.aspx) {
            access_log /var/log/nginx/security.log security;
            return 444;
        }

        # Block SQL injection patterns
        location ~* (union.*select|concat.*\(|benchmark\(|sleep\(|load_file) {
            access_log /var/log/nginx/security.log security;
            return 444;
        }

        # Block path traversal
        location ~* (\.\./|\.\.\\|/\./) {
            access_log /var/log/nginx/security.log security;
            return 444;
        }

        # Health check endpoint (exclude from security blocks)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            autoindex on;
            allow all;
        }

        # Frontend - with rate limiting
        location / {
            limit_req zone=general burst=20 nodelay;

            # SPA fallback: if frontend returns 404 for deep links, serve index.html
            proxy_intercept_errors on;
            error_page 404 = /index.html;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Serve the SPA entry for fallback rewrites
        location = /index.html {
            proxy_pass http://frontend/index.html;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Backend API - with stricter rate limiting
        location /api/ {
            limit_req zone=api burst=15 nodelay;
            
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # API timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Simple health check
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}